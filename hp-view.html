   c = 포트폴리오 내용(JSON), mode = 'edit' | 'export'
   텍스트는 data-k, 사진은 data-img 로 표시되어 편집기에서 클릭 수정됩니다. */

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = s => esc(s).replace(/\n/g,'<br>');

function phSvg(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${label==='AFTER'?'#eef3f6':'#e9e4de'}"/><stop offset="1" stop-color="${label==='AFTER'?'#d8e2e9':'#d6cec5'}"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><g fill="none" stroke="#9a948c" stroke-width="5" opacity=".55"><path d="M250 270c0-40 30-60 55-60s35 15 45 15 20-15 45-15 55 20 55 60c0 70-25 130-45 130s-20-60-55-60-35 60-55 60-45-60-45-130z"/><path d="M470 270c0-40 30-60 55-60s35 15 45 15 20-15 45-15 55 20 55 60c0 70-25 130-45 130s-20-60-55-60-35 60-55 60-45-60-45-130z"/></g><text x="${label==='AFTER'?675:225}" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#7b746c">실제 ${label==='AFTER'?'치료 후':'치료 전'} 사진</text><text x="${label==='AFTER'?675:225}" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#7b746c">으로 교체하세요</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const HP_ASSET_BASE = 'assets/hp-studio/';
function makeR(c, mode, files){
  const src = k => {
    const v = c[k] || '';
    let data;
    if (v.startsWith('asset:')) data = HP_ASSET_BASE + v.slice(6) + '.webp';
    else if (v.startsWith('ph:')) data = phSvg(v.slice(3));
    else data = v;
    if (mode !== 'export' || !data) return data || '';
    let ext = 'jpg';
    const m = /^data:image\/([a-z+]+)/.exec(data);
    if (m) ext = m[1].replace('svg+xml','svg').replace('jpeg','jpg');
    else { const e = /\.([a-z0-9]{3,4})(?:\?|#|$)/i.exec(data); if (e) ext = e[1].toLowerCase(); }
    const name = 'images/' + k + '.' + ext;
    files[name] = data.startsWith('data:') ? data : { url: data };
    return name;
  };
  return {
    t: (k, tag='x-t', cls='') => `<${tag}${cls?` class="${cls}"`:''} data-k="${k}">${fmt(c[k])}</${tag}>`,
    i: (k, cls='', alt='') => `<img${cls?` class="${cls}"`:''} data-img="${k}" src="${src(k)}" alt="${esc(alt||c.name)}" loading="lazy">`,
    src, v: k => esc(c[k])
  };
}

function mapBox(c){
  const a = c.address || '';
  if (!a || /0000|00구/.test(a)) return `<div class="mapbox ph"><div>${ic('pin')}<b>지도 영역</b><small>실제 주소를 입력하면 지도가 표시됩니다</small></div></div>`;

}

  const msg = opt.msg !== false;
  return `<form class="cform" action="https://formsubmit.co/${esc(c.email)}" method="POST" data-mail="${esc(c.email)}">
    <input type="hidden" name="_subject" value="[${esc(c.name)}] 홈페이지 상담 문의">

}

   content = { v:2, site:{...공통정보}, blocks:[{id,type,hidden,data}] }
   경로(path): 's/name'  ·  'b/<블록ID>/title'  ·  'b/<블록ID>/items/0/img'
===================================================================== */
const bid = () => 'b' + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
function getp(o, p){ return String(p).split('/').reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setp(o, p, v){ const ks = String(p).split('/'); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null) a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
function resolvePath(content, path){
  const [root, ...rest] = String(path).split('/');
  if (root === 's') return { obj: content.site, key: rest.join('/') };
  if (root === 'b'){ const b = content.blocks.find(x => x.id === rest[0]); return b ? { obj: b.data, key: rest.slice(1).join('/') } : null; }
  return null;
}
function getPath(content, path){ const r = resolvePath(content, path); return r ? getp(r.obj, r.key) : undefined; }
function setPath(content, path, v){ const r = resolvePath(content, path); if (r) setp(r.obj, r.key, v); }

/* ---------- 렌더러: prefix 아래의 값을 읽고, 편집용 data-k / data-img 표시 ---------- */
function makeR2(base, prefix, mode, files){
  const val = k => getp(base, k);
  const src = k => {
    const v = val(k) || '';
    let data;
    if (v.startsWith('asset:')) data = HP_ASSET_BASE + v.slice(6) + '.webp';
    else if (v.startsWith('ph:')) data = phSvg(v.slice(3));
    else data = v;
    if (mode !== 'export' || !data) return data || '';
    let ext = 'jpg';
    const m = /^data:image\/([a-z+]+)/.exec(data);
    if (m) ext = m[1].replace('svg+xml', 'svg').replace('jpeg', 'jpg');
    else { const e = /\.([a-z0-9]{3,4})(?:\?|#|$)/i.exec(data); if (e) ext = e[1].toLowerCase(); }
    const name = 'images/' + (prefix + k).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.' + ext;
    files[name] = data.startsWith('data:') ? data : { url: data };
    return name;
  };
  return {
    t: (k, tag = 'x-t', cls = '') => `<${tag}${cls ? ` class="${cls}"` : ''} data-k="${prefix + k}">${fmt(val(k))}</${tag}>`,
    i: (k, cls = '', alt = '') => val(k) ? `<img${cls ? ` class="${cls}"` : ''} data-img="${prefix + k}" src="${src(k)}" alt="${esc(alt)}" loading="lazy">` : (mode === 'edit' ? `<img${cls ? ` class="${cls}"` : ''} data-img="${prefix + k}" src="${phSvg('PHOTO')}" alt="">` : ''),
    v: k => esc(val(k)), raw: val, src
  };
}

const SITE_KEYS = ['name','nameEn','color','color2','phone','address','traffic','hours','email','kakao','youtube','metaTitle','metaDesc','biz','form_btn'];
function blockFromFlat(theme, type, flat){
  const def = BLOCKDEFS[theme].blocks[type];
  if (def.defaults) return def.defaults();
  const data = {};
  def.fields.forEach(f => {
    if (f.key === 'menu'){ data.menu = def.menu || ''; return; }
    if (f.type === 'list'){
      data[f.key] = Array.from({length: f.count}, (_, i) => {
        const it = {};
        f.item.forEach(x => { const fk = x.from ? x.from(i) : null; it[x.key] = (fk && flat[fk] != null) ? flat[fk] : (x.dflt ? x.dflt(i) : (x.def ?? '')); });
        return it;
      });
      return;
    }
    const fk = f.from ? f.from() : f.key;
    data[f.key] = flat[fk] != null ? flat[fk] : (f.def ?? '');
  });
  return data;
}
function migrateContent(theme, flat){
  if (flat && flat.v === 2) return ensureNav(flat, theme);
  const base = DEFAULTS[theme]();                // 예전 샘플(기본값)
  const src = { ...base, ...(flat || {}) };      // 예전에 수정한 내용 우선
  const site = {};
  SITE_KEYS.forEach(k => site[k] = src[k] ?? '');
  (BLOCKDEFS[theme].siteFields || []).forEach(f => site[f.key] = src[f.key] ?? '');
  if (theme === 'network') site.d_mark = src.d_mark || 'D2';
  if (theme === 'grand') site.g_cta = src.g_cta || '상담 예약';
  if (theme === 'premium') site.p_form_t = src.p_form_t || '1:1 상담 신청';
  if (theme === 'd2') site.d_mark = src.d_mark || 'D2';
  const blocks = BLOCKDEFS[theme].layout.map(type => ({ id: bid(), type, hidden: false, data: blockFromFlat(theme, type, src) }));
  return ensureNav({ v: 2, site, blocks }, theme, true);
}
function defaultContent(theme){ return migrateContent(theme, {}); }
function newBlockData(theme, type){
  const def = BLOCKDEFS[theme].blocks[type];
  if (def.defaults) return def.defaults();
  const cur = defaultContent(theme).blocks.find(b => b.type === type);
  return cur ? cur.data : blockFromFlat(theme, type, DEFAULTS[theme]());
}
function firstImage(content){
  let found = '';
  const walk = o => { if (found || o == null) return; if (typeof o === 'string'){ if (/^(asset:|https?:|data:image)/.test(o)) found = o; return; } if (typeof o === 'object') Object.values(o).forEach(walk); };
  (content.blocks || []).filter(b => !b.hidden).forEach(b => walk(b.data));
  return found;
}

/* ---------- 상단 메뉴 (메인 메뉴 + 소메뉴) ----------
   site.nav = [{ label, href, children:[{label, href}] }]
   href: '#b-<블록ID>' (페이지 안 블록) · '#top' · 'https://...' 외부 링크 · 'tel:...' */
const SUBMENU_SAMPLES = { d2:'services', local:'services', premium:'services', network:'clinics' };
function ensureNav(content, theme, isNew){
  if (Array.isArray(content.site.nav)) return content;
  const vis = content.blocks.filter(b => !b.hidden && (b.data.menu || '').trim());
  content.site.nav = vis.map(b => {
    const item = { label: b.data.menu.trim(), href: '#b-' + b.id, children: [] };
    // 진료과목 메뉴에는 예시 소메뉴를 넣어 둡니다
    if (isNew && SUBMENU_SAMPLES[theme] === b.type){
      const its = (b.data.items || []).slice(0, 4);
      item.children = its.map(it => ({ label: String(it.t || it.k || '').split('\n')[0].trim() || '세부 메뉴', href: '#b-' + b.id }));
    }
    return item;
  });
  return content;
}
function resolveNav(content, mode){
  const ok = href => {
    if (!href) return '#top';
    if (href.startsWith('#b-')){ const b = content.blocks.find(x => '#b-' + x.id === href); if (!b || (b.hidden && mode === 'export')) return null; }
    return href;
  };
  const ext = h => /^https?:/i.test(h);
  return (content.site.nav || []).map(n => {
    const kids = (n.children || []).map(c => ({ label: c.label || '', href: ok(c.href), ext: ext(c.href || '') })).filter(c => c.label && c.href);
    let href = ok(n.href);
    if (!href && kids.length) href = kids[0].href;
    return { label: n.label || '', href, ext: ext(n.href || ''), children: kids };
  }).filter(n => n.label && n.href);
}
function navHTML(ctx){
  const a = (n, cls) => `<a href="${esc(n.href)}"${cls ? ` class="${cls}"` : ''}${n.ext ? ' target="_blank" rel="noopener"' : ''}>${esc(n.label)}</a>`;
  return ctx.nav.map(n => n.children.length
    ? `<div class="mi has-sub">${a(n, 'mi-a')}<div class="sub"><div class="sub-in">${n.children.map(c => a(c)).join('')}</div></div></div>`
    : a(n)).join('');
}

.cb-sub h1{font-size:clamp(34px,4.6vw,58px);letter-spacing:-.03em;line-height:1.2}
.cb-sub p{margin-top:14px;font-size:17px;opacity:.88;max-width:640px}
.cb-sub .crumb{margin-top:28px;font-size:13px;opacity:.75;display:flex;gap:8px;flex-wrap:wrap}.cb-sub .crumb x-t{display:inline}
.cb-pts .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.cb-pts .it{border:1px solid var(--line);border-radius:calc(var(--r) + 8px);padding:34px 30px;background:rgba(127,127,127,.04)}
.cb-pts .ic{width:46px;height:46px;padding:11px;border-radius:14px;background:var(--pc);color:#fff;margin-bottom:20px}
.cb-pts b{display:block;font-size:19px;margin-bottom:8px}.cb-pts .it p{opacity:.72;font-size:15px;line-height:1.8}
.cb-steps ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;counter-reset:st}
.cb-steps li{counter-increment:st;position:relative;padding:30px 24px 26px;border-top:3px solid var(--pc);background:rgba(127,127,127,.05);border-radius:0 0 var(--r) var(--r)}
.cb-steps li:before{content:'STEP 0' counter(st);display:block;font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--pc);margin-bottom:10px}
.cb-steps b{display:block;font-size:18px;margin-bottom:6px}.cb-steps li p{opacity:.72;font-size:14px;line-height:1.8}
.cb-docs .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.cb-docs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r)}
.cb-docs .po{color:var(--pc);font-weight:700;font-size:14px;margin-top:18px}.cb-docs b{display:block;font-size:22px;margin:2px 0 12px}.cb-docs .cr{opacity:.72;font-size:14px;line-height:1.9}
.cb-gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cb-gal figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r)}.cb-gal figcaption{font-size:14px;opacity:.7;margin-top:8px}
.cb-loc .grid{display:grid;grid-template-columns:1fr 1.2fr;gap:50px;align-items:start}
.cb-loc .row{display:flex;gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}.cb-loc .row .ic{width:24px;height:24px;color:var(--pc);margin-top:2px}
.cb-loc .row b{display:block;margin-bottom:4px}.cb-loc .tel{font-size:28px;font-weight:800}.cb-loc .mapbox{border-radius:var(--r)}
.cb-greet .grid{display:grid;grid-template-columns:380px 1fr;gap:64px;align-items:center}
.cb-greet img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r)}
.cb-greet small{color:var(--pc);font-weight:800;letter-spacing:.2em;font-size:13px}.cb-greet h2{font-size:clamp(26px,3vw,38px);letter-spacing:-.03em;line-height:1.4;margin:12px 0 22px}
.cb-greet .msg{line-height:2;opacity:.82}.cb-greet .sign{margin-top:28px;font-weight:800;font-size:18px}.cb-greet .cr{margin-top:18px;font-size:14px;line-height:1.9;opacity:.65}
.cb-quick .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cb-quick a{display:grid;justify-items:center;text-align:center;gap:10px;padding:30px 16px;border:1px solid var(--line);border-radius:calc(var(--r) + 10px);transition:.25s;background:rgba(127,127,127,.03)}
.cb-quick a:hover{border-color:var(--pc);transform:translateY(-3px)}.cb-quick .ic{width:48px;height:48px;padding:11px;border-radius:50%;background:var(--pc);color:#fff}
.cb-quick b{font-size:17px}.cb-quick span{font-size:13px;opacity:.65}
.sec.svc .grid>a,.s5 .grid>a{display:block;color:inherit}.svc .grid>a.it{display:flex}.sec.svc .more{display:inline-block;margin-top:14px;font-style:normal;font-size:13px;color:var(--pc);font-weight:700}
.hd nav>a.on,.hd nav .mi.on>.mi-a{color:var(--pc)}
.t-premium.sub .hd{background:rgba(246,242,236,.96)}.t-premium.sub .cb-sub .wrap{padding-top:170px}
.t-grand.sub .hd:not(.scrolled){background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.t-network .cb-sub .wrap,.t-local .cb-sub .wrap{padding-top:90px}

.cb-foot{background:#1e1814;color:#b9ad9f;padding:46px 0;font-size:13px}.cb-foot .wrap{display:grid;gap:8px}.cb-foot b{color:#fff;font-size:17px}
@media(max-width:900px){.cb-loc .grid,.cb-greet .grid{grid-template-columns:1fr;gap:30px}.cb-sub{min-height:300px}.cb-sub .wrap{padding:120px 0 44px}}`;

firstImage = function(content){
  let found = '';
  const walk = o => { if (found || o == null) return; if (typeof o === 'string'){ if (/^(asset:|https?:|data:image)/.test(o)) found = o; return; } if (typeof o === 'object') Object.values(o).forEach(walk); };
  const bl = content.pages ? content.pages[0].blocks : (content.blocks || []);
  bl.filter(b => !b.hidden).forEach(b => walk(b.data));

};

function makeLinker(content, mode, pageId, opt = {}){
  const pages = content.pages || [];
  const fileOf = p => (p.id === 'home' ? 'index' : p.slug) + '.html';
  return target => {
    target = String(target || '').trim();
    if (!target) return '#top';
    if (/^(https?:|tel:|mailto:|sms:)/i.test(target)) return target;
    let pid = pageId, h = '';
    if (target.startsWith('p:')){ const i = target.indexOf('#'); pid = i < 0 ? target.slice(2) : target.slice(2, i); h = i < 0 ? '' : target.slice(i + 1); }
    else if (target.startsWith('#b-')){ h = target.slice(1); const pg = pageOfBlock(content, h.slice(2)); pid = pg ? pg.id : pageId; }
    else if (target === '#top' || target === '#') return '#top';
    else return target;
    const page = pages.find(p => p.id === pid); if (!page) return '#top';
    if (h){ const b = page.blocks.find(x => 'b-' + x.id === h); if (!b || (b.hidden && mode !== 'edit')) h = ''; }
    if (pid === pageId) return h ? '#' + h : '#top';
    if (mode === 'export') return fileOf(page) + (h ? '#' + h : '');
    if (mode === 'view') return (opt.viewBase || '?') + (page.id === 'home' ? '' : '&pg=' + encodeURIComponent(page.slug)) + (h ? '#' + h : '');
    return '#pg=' + encodeURIComponent(pid) + (h ? '&h=' + encodeURIComponent(h) : '');
  };
}
function navTargetPage(target){ if (String(target||'').startsWith('p:')) return target.slice(2).split('#')[0]; return null; }

siteCtx = function(content, theme, mode, pageId = 'home', opt = {}){
  const page = (content.pages || []).find(p => p.id === pageId) || content.pages[0];
  const link = makeLinker(content, mode, page.id, opt);
  const vis = page.blocks.filter(b => !b.hidden);
  const T = BLOCKDEFS[theme];
  const ext = h => /^https?:/i.test(h || '');
  const nav = (content.site.nav || []).map(n => {
    const kids = (n.children || []).filter(c => c.label).map(c => ({ label:c.label, href:link(c.href), ext:ext(c.href), on: navTargetPage(c.href) === page.id }));
    return { label:n.label || '', href: link(n.href || (n.children && n.children[0] && n.children[0].href) || ''), ext:ext(n.href), children:kids, on: navTargetPage(n.href) === page.id || kids.some(k => k.on) };
  }).filter(n => n.label);
  return {
    site: content.site, page, link, nav, home: link('p:home'),
    all: vis.map(b => ({ href: '#b-' + b.id, label: (T.blocks[b.type] || {}).label || '' })),
    go: type => { const here = vis.find(x => x.type === type); if (here) return '#b-' + here.id;
      for (const p of content.pages){ const b = p.blocks.find(x => x.type === type && !x.hidden); if (b) return link('p:' + p.id + '#b-' + b.id); }
      return '#top'; }
  };
};

<script>
(async function(){
  function fail(msg){ document.getElementById('ld').innerHTML = '<b>미리보기를 열 수 없습니다</b><small>' + (msg || '링크가 만료되었거나 공유가 꺼져 있습니다.<br>링크를 보내준 담당자에게 문의해 주세요.') + '</small>'; }
  try {
    var tok = new URLSearchParams(location.search).get('p');
    if (!tok) return fail('미리보기 주소가 올바르지 않습니다.');
    var res = await sb.rpc('hp_get_shared', { p_token: tok });
    if (res.error || !res.data || !res.data.length) return fail();
    var r = res.data[0];
    var content = migrateContent(r.theme, r.content || {});
    var slug = new URLSearchParams(location.search).get('pg') || '';
    var pg = content.pages.find(function(x){ return x.slug === slug; }) || content.pages[0];
    var html = renderSite(content, r.theme, 'view', {}, { page: pg.id, viewBase: 'hp-view.html?p=' + encodeURIComponent(tok), head: '<meta name="robots" content="noindex,nofollow"><script>window.__EDIT=false<\/script>' });
    if (document.readyState === 'loading') await new Promise(function(r){ document.addEventListener('DOMContentLoaded', r); });
    await new Promise(function(r){ setTimeout(r, 0); });
    document.open(); document.write(html); document.close();
  } catch (e) { console.error(e); fail(); }
})();
</script>
