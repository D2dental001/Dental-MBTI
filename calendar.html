<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 캘린더</title>
<!-- 모바일에서 "홈 화면에 추가"로, 캘린더만 따로 앱처럼 설치할 수 있도록 하는 PWA 설정
     (전체 HR OS의 manifest.webmanifest와는 별개의 독립된 앱으로 설치됩니다) -->
<link rel="manifest" href="calendar-manifest.webmanifest">
<meta name="theme-color" content="#4f6df5">
<link rel="apple-touch-icon" href="calendar-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공유 캘린더">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#141b33; --navy2:#1e2a52; --accent:#3b6bf5; --accent-soft:#eaf0ff;
    --accent2:#17a673; --warn:#e5484d; --bg:#eef1f7; --card:#ffffff;
    --muted:#6b7280; --border:#e7eaf1; --text:#1d2433;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}
  a{color:inherit;}

  .topbar{
    background:#fff;border-bottom:1px solid var(--border);padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
    flex-wrap:wrap;gap:8px;
  }
  .topbar h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;}
  .topbar .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c5cf0);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;}
  .topbar .right{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);}
  .topbar .right a{text-decoration:underline;cursor:pointer;}

  .content{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
  .card{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,27,51,.04);}
  .card h2{font-size:16px;margin:0 0 6px;}
  .desc{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
  .small-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .hidden{display:none !important;}

  label.field{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=time],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;margin-bottom:14px;
    font-family:inherit;background:#fbfcfe;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff;}

  .btn{padding:10px 18px;border-radius:10px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.sm{padding:7px 13px;font-size:12.5px;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.green{background:var(--accent2);color:#fff;}
  .btn.danger{background:var(--warn);color:#fff;}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- 생일 캘린더 ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0;}
  .cal-cell{min-height:74px;border:1px solid var(--border);border-radius:10px;padding:6px 7px;font-size:12.5px;background:#fbfcfe;cursor:pointer;transition:background .1s,border-color .1s;}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell:not(.empty):hover{background:#f0f4ff;border-color:#c7d2fe;}
  .cal-cell:not(.empty):active{background:#e5ebff;}
  .cal-cell.today{border-color:var(--accent);background:var(--accent-soft);}
  .cal-daynum{font-weight:700;color:#374151;margin-bottom:4px;}
  .cal-cell.today .cal-daynum{color:var(--accent);}
  .cal-birth{display:block;background:#ffe9d6;color:#a05a12;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;margin-bottom:3px;line-height:1.5;}
  .cal-sched-tag{display:block;border-radius:5px;padding:1px 5px;font-size:10.5px;font-weight:700;margin-bottom:3px;line-height:1.5;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-sched-more{display:block;font-size:10.5px;color:var(--muted);font-weight:700;padding:0 2px;}
  .birthday-row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .birthday-row:last-child{border-bottom:none;}

  /* ---------- 일정 상세/입력 모달 ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.46);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0;}
  .modal-box{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);}
  @media(min-width:560px){
    .modal-overlay{align-items:center;padding:20px;}
    .modal-box{border-radius:18px;max-height:85vh;}
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .modal-head h2{margin:0;font-size:17px;}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px;}
  .sched-item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:12px 0;}
  .sched-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .sched-color-dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .sched-item-title{font-weight:700;font-size:14.5px;flex:1;}
  .sched-item-time{font-size:12px;color:var(--muted);}
  .sched-item-content{font-size:13px;color:#4b5568;white-space:pre-wrap;line-height:1.55;margin-top:4px;}
  .sched-item-actions{display:flex;gap:6px;margin-top:8px;}
  .sched-empty{font-size:13px;color:var(--muted);padding:10px 2px;}
  .color-swatch-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:8px 0 14px;}
  .color-swatch{width:100%;aspect-ratio:1/1;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .color-swatch.selected{border-color:#111827;box-shadow:0 0 0 2px #fff inset;}
  @media(max-width:420px){ .color-swatch-grid{grid-template-columns:repeat(8,1fr);} }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="mark">HR</span>공유 캘린더</h1>
  <div class="right">
    <button class="btn primary sm hidden" id="installAppBtn" onclick="installApp()">📲 앱으로 설치</button>
    <span id="topMeta"></span>
    <a onclick="location.href='hr-dashboard.html'">전체 관리자 메뉴</a>
    <a onclick="doLogout()">로그아웃</a>
  </div>
</div>

<div class="content">
  <div class="card">
    <div class="cal-head">
      <button class="btn ghost sm" onclick="shiftCalendar(-1)">← 이전달</button>
      <h2 id="calMonthLabel" style="margin:0;"></h2>
      <button class="btn ghost sm" onclick="shiftCalendar(1)">다음달 →</button>
    </div>
    <div class="desc">재직중인 임직원의 생일만 표시됩니다. 날짜를 누르면 그날의 일정을 보거나 추가할 수 있습니다 — 입력한 일정은 모든 관리자 계정에 공유됩니다.</div>
    <div style="margin-bottom:10px;">
      <button class="btn ghost sm" id="notifToggleBtn" onclick="enableScheduleNotifications()">🔔 이 기기에서 일정 알림 켜기</button>
      <span class="small-note" id="notifStatusNote" style="margin-left:8px;"></span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="card">
    <h2>이번 달 생일자</h2>
    <div id="birthdayList"></div>
  </div>
</div>

<!-- ===================== 일정 상세/입력 모달 ===================== -->
<div class="modal-overlay hidden" id="scheduleModal" onclick="if(event.target===this) closeDayDetail()">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="scheduleModalDate"></h2>
      <button class="modal-close" onclick="closeDayDetail()">&times;</button>
    </div>
    <div id="scheduleExistingList"></div>
    <div id="scheduleAddFormWrap">
      <button class="btn green sm" id="scheduleAddToggleBtn" onclick="openScheduleAddForm()">+ 새 일정 추가</button>
      <div id="scheduleAddForm" class="hidden" style="margin-top:14px;">
        <label class="field">제목</label>
        <input type="text" id="schedTitle" placeholder="예: 정기 회의">
        <label class="field">시간 (선택)</label>
        <input type="time" id="schedTime">
        <label class="field">내용</label>
        <textarea id="schedContent" rows="3" placeholder="상세 내용을 입력하세요" style="resize:vertical;"></textarea>
        <label class="field">표시 색깔</label>
        <div class="color-swatch-grid" id="schedColorGrid"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn primary sm" onclick="saveNewSchedule()">저장</button>
          <button class="btn ghost sm" onclick="closeScheduleAddForm()">취소</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="supabase-init-hr.js"></script>
<script>
let CURRENT_USER = null;
let EMPLOYEES = [];

(async function init(){
  CURRENT_USER = await hrRequireAdmin('index.html');
  if(!CURRENT_USER) return;
  document.getElementById('topMeta').textContent = CURRENT_USER.email;
  EMPLOYEES = await hrListEmployees();
  renderCalendar();
  updateNotifStatusNote();
  if('Notification' in window && Notification.permission==='granted') startScheduleNotificationWatcher();
})();

function doLogout(){ hrLogout().then(()=>location.href='index.html'); }

/* ---------------------- 생일 캘린더 + 공유 일정 ---------------------- */
let calendarViewDate = new Date();
let SCHEDULES_BY_DAY = {};
const SCHEDULE_COLORS = [
  '#ef4444','#f97316','#f59e0b','#eab308','#84cc16',
  '#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9',
  '#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef',
  '#ec4899','#f43f5e','#78716c','#64748b','#334155'
];
function shiftCalendar(delta){
  calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+delta, 1);
  renderCalendar();
}
async function renderCalendar(){
  const y = calendarViewDate.getFullYear();
  const m = calendarViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${y}년 ${m+1}월`;

  const activeEmployees = EMPLOYEES.filter(e => !e.retire_date && e.birth);
  const birthdaysByDay = {};
  activeEmployees.forEach(e=>{
    const b = new Date(e.birth);
    if(b.getMonth() === m){
      const d = b.getDate();
      (birthdaysByDay[d] = birthdaysByDay[d] || []).push(e.name);
    }
  });

  const scheduleRows = await hrListSchedulesByMonth(y, m+1);
  SCHEDULES_BY_DAY = {};
  scheduleRows.forEach(r=>{
    const d = Number(r.schedule_date.slice(8,10));
    (SCHEDULES_BY_DAY[d] = SCHEDULES_BY_DAY[d] || []).push(r);
  });

  const firstDow = new Date(y, m, 1).getDay();
  const daysInThisMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const isThisMonthReal = (today.getFullYear()===y && today.getMonth()===m);

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach(d=>{
    const el = document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  for(let i=0;i<firstDow;i++){
    const el = document.createElement('div'); el.className='cal-cell empty'; grid.appendChild(el);
  }
  for(let d=1; d<=daysInThisMonth; d++){
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + ((isThisMonthReal && today.getDate()===d) ? ' today' : '');
    cell.onclick = ()=>openDayDetail(y, m, d);
    const names = birthdaysByDay[d] || [];
    const scheds = SCHEDULES_BY_DAY[d] || [];
    const maxShow = 3;
    let schedHtml = scheds.slice(0, maxShow).map(s=>
      `<span class="cal-sched-tag" style="background:${s.color}">${(s.title||'').slice(0,4)}</span>`
    ).join('');
    if(scheds.length > maxShow) schedHtml += `<span class="cal-sched-more">+${scheds.length - maxShow}건 더</span>`;
    cell.innerHTML = `<div class="cal-daynum">${d}</div>` + names.map(n=>`<span class="cal-birth">생일 · ${n}</span>`).join('') + schedHtml;
    grid.appendChild(cell);
  }

  const listBox = document.getElementById('birthdayList');
  const sortedDays = Object.keys(birthdaysByDay).map(Number).sort((a,b)=>a-b);
  if(sortedDays.length===0){
    listBox.innerHTML = '<div class="small-note">해당 월에 생일인 재직 직원이 없습니다.</div>';
  } else {
    listBox.innerHTML = sortedDays.map(d=>
      birthdaysByDay[d].map(n=>`<div class="birthday-row"><span>${n}</span><span>${m+1}월 ${d}일</span></div>`).join('')
    ).join('');
  }
}

/* ---------------------- 일정 상세/입력 모달 ---------------------- */
let scheduleModalYMD = null;
let editingScheduleId = null;

function openDayDetail(y, m, d){
  scheduleModalYMD = { y, m, d };
  document.getElementById('scheduleModalDate').textContent = `${y}년 ${m+1}월 ${d}일`;
  renderScheduleExistingList();
  closeScheduleAddForm();
  document.getElementById('scheduleModal').classList.remove('hidden');
}
function closeDayDetail(){
  document.getElementById('scheduleModal').classList.add('hidden');
  scheduleModalYMD = null;
}
function renderScheduleExistingList(){
  const { d } = scheduleModalYMD;
  const list = (SCHEDULES_BY_DAY[d] || []).slice().sort((a,b)=>(a.start_time||'99:99').localeCompare(b.start_time||'99:99'));
  const box = document.getElementById('scheduleExistingList');
  if(list.length===0){
    box.innerHTML = '<div class="sched-empty">이 날짜에 등록된 일정이 없습니다.</div>';
    return;
  }
  box.innerHTML = list.map(s=>`
    <div class="sched-item">
      <div class="sched-item-head">
        <span class="sched-color-dot" style="background:${s.color}"></span>
        <span class="sched-item-title">${s.title}</span>
        ${s.start_time ? `<span class="sched-item-time">${s.start_time}</span>` : ''}
      </div>
      ${s.content ? `<div class="sched-item-content">${s.content.replace(/</g,'&lt;')}</div>` : ''}
      ${s.created_by_email ? `<div class="small-note" style="margin-top:4px;">입력: ${s.created_by_email}</div>` : ''}
      <div class="sched-item-actions">
        <button class="btn ghost sm" onclick="startEditSchedule('${s.id}')">수정</button>
        <button class="btn danger sm" onclick="deleteScheduleItem('${s.id}')">삭제</button>
      </div>
    </div>`).join('');
}
function renderColorSwatches(selected){
  const grid = document.getElementById('schedColorGrid');
  grid.innerHTML = SCHEDULE_COLORS.map(c=>
    `<div class="color-swatch${c===selected?' selected':''}" style="background:${c}" data-color="${c}" onclick="selectScheduleColor('${c}')"></div>`
  ).join('');
}
function selectScheduleColor(c){
  document.getElementById('schedColorGrid').dataset.selected = c;
  renderColorSwatches(c);
}
function openScheduleAddForm(){
  editingScheduleId = null;
  document.getElementById('schedTitle').value = '';
  document.getElementById('schedTime').value = '';
  document.getElementById('schedContent').value = '';
  renderColorSwatches(SCHEDULE_COLORS[0]);
  document.getElementById('schedColorGrid').dataset.selected = SCHEDULE_COLORS[0];
  document.getElementById('scheduleAddForm').classList.remove('hidden');
  document.getElementById('scheduleAddToggleBtn').classList.add('hidden');
}
function closeScheduleAddForm(){
  editingScheduleId = null;
  document.getElementById('scheduleAddForm').classList.add('hidden');
  document.getElementById('scheduleAddToggleBtn').classList.remove('hidden');
}
function startEditSchedule(id){
  const { d } = scheduleModalYMD;
  const s = (SCHEDULES_BY_DAY[d] || []).find(x=>x.id===id);
  if(!s) return;
  editingScheduleId = id;
  document.getElementById('schedTitle').value = s.title || '';
  document.getElementById('schedTime').value = s.start_time || '';
  document.getElementById('schedContent').value = s.content || '';
  renderColorSwatches(s.color);
  document.getElementById('schedColorGrid').dataset.selected = s.color;
  document.getElementById('scheduleAddForm').classList.remove('hidden');
  document.getElementById('scheduleAddToggleBtn').classList.add('hidden');
}
async function saveNewSchedule(){
  const title = document.getElementById('schedTitle').value.trim();
  const time = document.getElementById('schedTime').value;
  const content = document.getElementById('schedContent').value.trim();
  const color = document.getElementById('schedColorGrid').dataset.selected || SCHEDULE_COLORS[0];
  if(!title){ alert('일정 제목을 입력해 주세요.'); return; }
  const { y, m, d } = scheduleModalYMD;
  const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  try{
    if(editingScheduleId){
      await hrUpdateSchedule(editingScheduleId, { schedule_date: dateStr, start_time: time||null, title, content, color });
    } else {
      await hrCreateSchedule({ schedule_date: dateStr, start_time: time||null, title, content, color });
    }
    closeScheduleAddForm();
    await renderCalendar();
    renderScheduleExistingList();
  } catch(e){ alert('일정 저장 실패: '+e.message); console.error(e); }
}
async function deleteScheduleItem(id){
  if(!confirm('이 일정을 삭제하시겠습니까?')) return;
  try{
    await hrDeleteSchedule(id);
    await renderCalendar();
    renderScheduleExistingList();
  } catch(e){ alert('삭제 실패: '+e.message); console.error(e); }
}

/* ---------------------- 일정 알림 (이 화면/설치된 앱이 열려 있는 동안만 동작) ---------------------- */
let notifiedScheduleIds = new Set();
let scheduleWatcherTimer = null;
function updateNotifStatusNote(){
  const note = document.getElementById('notifStatusNote');
  const btn = document.getElementById('notifToggleBtn');
  if(!('Notification' in window)){ note.textContent = '(이 브라우저는 알림을 지원하지 않습니다)'; btn.disabled = true; return; }
  if(Notification.permission === 'granted'){ note.textContent = '알림 켜짐 — 이 화면이 열려 있는 동안 작동합니다.'; btn.textContent = '🔔 알림 켜짐'; }
  else if(Notification.permission === 'denied'){ note.textContent = '브라우저에서 알림이 차단되어 있습니다 (브라우저 설정에서 허용해 주세요).'; }
  else { note.textContent = ''; btn.textContent = '🔔 이 기기에서 일정 알림 켜기'; }
}
function enableScheduleNotifications(){
  if(!('Notification' in window)){ alert('이 브라우저는 알림 기능을 지원하지 않습니다.'); return; }
  Notification.requestPermission().then(perm=>{
    updateNotifStatusNote();
    if(perm==='granted'){
      startScheduleNotificationWatcher();
      alert('알림이 켜졌습니다. 이 화면(또는 설치된 앱)을 열어 둔 상태에서, 일정 시작 시각에 알림이 뜹니다.');
    } else if(perm==='denied'){
      alert('알림 권한이 거부되었습니다. 브라우저 설정에서 이 사이트의 알림을 허용해야 사용할 수 있습니다.');
    }
  });
}
function startScheduleNotificationWatcher(){
  if(scheduleWatcherTimer) return;
  checkUpcomingSchedules();
  scheduleWatcherTimer = setInterval(checkUpcomingSchedules, 30000);
}
async function checkUpcomingSchedules(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const rows = await hrListSchedulesByMonth(y, m);
  const todayStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  rows.filter(r=>r.schedule_date===todayStr && r.start_time).forEach(r=>{
    const [hh,mm] = r.start_time.split(':').map(Number);
    const schedDt = new Date(y, m-1, d, hh, mm);
    const diffMin = (schedDt - now)/60000;
    if(diffMin <= 0 && diffMin > -1 && !notifiedScheduleIds.has(r.id)){
      notifiedScheduleIds.add(r.id);
      new Notification(`📅 ${r.title}`, { body: r.content || '일정 시작 시각입니다.', tag: 'sched-'+r.id });
    }
  });
}

/* ---------------------- 서비스 워커 등록 (전체 HR OS와 같은 service-worker.js를 공유) ---------------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.error('[service worker 등록 실패]', e));
  });
}

/* ---------------------- 앱 설치(PWA) — 상단 "📲 앱으로 설치" 버튼 ---------------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.classList.remove('hidden');
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.classList.add('hidden');
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
}
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.classList.add('hidden');
});
</script>
