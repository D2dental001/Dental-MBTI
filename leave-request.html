<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>연차 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --navy:#1b2a4a; --navy2:#24365e; --accent:#3b6bf5; --accent2:#17a673; --warn:#e5484d; --bg:#f4f6fb; --border:#e3e7ef; --muted:#6b7280; --teal:#0d9488; }
  *{box-sizing:border-box;}
  body{margin:0;overflow-x:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:#1f2937;-webkit-tap-highlight-color:transparent;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px 20px;text-align:center;}
  header h1{margin:0 0 6px;font-size:20px;}
  header p{margin:0;opacity:.85;font-size:13px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 120px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  label.field{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=tel]{width:100%;padding:13px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:14px;}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:disabled{opacity:.45;}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:#374151;}
  .hidden{display:none !important;}
  .err{color:var(--warn);font-size:13px;margin-top:10px;line-height:1.5;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6;}
  .hello{font-size:15px;font-weight:700;margin-bottom:4px;}
  .kinds{display:flex;gap:8px;margin:12px 0 4px;}
  .kinds button{flex:1;padding:11px 4px;border:1.5px solid var(--border);border-radius:10px;background:#fafbfe;font-size:13.5px;font-weight:700;cursor:pointer;color:#374151;}
  .kinds button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .monthbar{text-align:center;font-size:18px;font-weight:900;margin:6px 0 12px;}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .dow{font-size:11.5px;text-align:center;color:var(--muted);padding:4px 0;font-weight:700;}
  .dow:first-child{color:var(--warn);} .dow:nth-child(7){color:var(--accent);}
  .day{position:relative;aspect-ratio:1/1.15;border:1px solid var(--border);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;}
  .day.empty{border:none;background:none;cursor:default;}
  .day.sun{color:var(--warn);} .day.sat{color:var(--accent);}
  .day .tag{margin-top:3px;font-size:9.5px;max-width:100%;word-break:keep-all;font-weight:700;line-height:1.15;text-align:center;padding:2px 3px;border-radius:5px;}
  .day.sel{background:#e6f7f5;border:2px solid var(--teal);}
  .day.sel .tag{background:var(--teal);color:#fff;}
  .day.ok{background:#eef3ff;cursor:default;}
  .day.ok .tag{background:var(--accent);color:#fff;}
  .day.pend{background:#fff8e6;cursor:default;}
  .day.pend .tag{background:#e0a100;color:#fff;}
  .day.rej{background:#fdecec;cursor:default;}
  .day.rej .tag{background:var(--warn);color:#fff;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 14px calc(12px + env(safe-area-inset-bottom));}
  .bar-inner{max-width:520px;margin:0 auto;}
  .sum{font-size:13px;margin-bottom:8px;color:#374151;text-align:center;}
  .done{text-align:center;padding:10px 0;}
  .done .big{font-size:40px;}
  ul.list{margin:10px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.9;}
</style>
</head>
<body>
<header>
  <h1>🌴 연차 신청</h1>
  <p id="hdrSub">이름과 연락처로 본인 확인 후, 연차 날짜를 눌러 주세요.</p>
</header>

<div class="wrap">
  <div id="badLink" class="card hidden">
    <div class="hello">링크가 올바르지 않습니다</div>
    <div class="note">관리자에게 받은 연차 신청 링크를 다시 확인해 주세요.</div>
  </div>

  <!-- 1단계: 본인 확인 -->
  <div id="stepAuth" class="card hidden">
    <div class="hello">본인 확인</div>
    <div class="note" style="margin-bottom:14px;">직원 관리에 등록된 이름과 연락처가 일치해야 입장할 수 있습니다.</div>
    <label class="field">이름</label>
    <input type="text" id="inName" autocomplete="name" placeholder="홍길동">
    <label class="field">연락처</label>
    <input type="tel" id="inPhone" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000">
    <button class="btn" id="btnAuth" onclick="doAuth()">확인하고 달력 보기</button>
    <div id="authErr" class="err"></div>
  </div>

  <!-- 2단계: 달력 -->
  <div id="stepCal" class="hidden">
    <div class="card">
      <div class="hello" id="helloName"></div>
      <div class="note">① 아래에서 종류를 고르고 ② 날짜를 눌러 선택하세요. 다시 누르면 선택이 해제됩니다.</div>
      <div class="kinds" id="kinds">
        <button data-k="연차" class="on">연차<br><span style="font-weight:400;font-size:11px;">종일</span></button>
        <button data-k="오전반차">오전반차<br><span style="font-weight:400;font-size:11px;">0.5일</span></button>
        <button data-k="오후반차">오후반차<br><span style="font-weight:400;font-size:11px;">0.5일</span></button>
      </div>
    </div>
    <div class="card">
      <div class="monthbar" id="monthLabel"></div>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><i style="background:#0d9488"></i>이번에 선택</span>
        <span><i style="background:#3b6bf5"></i>승인 완료</span>
        <span><i style="background:#e0a100"></i>승인 대기</span>
        <span><i style="background:#e5484d"></i>반려</span>
      </div>
    </div>
    <div class="note" style="padding:0 6px;">※ 신청하면 관리자 승인 후 연차에 반영됩니다. 신청한 내용의 취소·수정은 관리자에게 요청해 주세요.</div>
  </div>

  <!-- 완료 -->
  <div id="stepDone" class="card hidden">
    <div class="done">
      <div class="big">✅</div>
      <div class="hello" id="doneTitle"></div>
      <div class="note" id="doneNote"></div>
    </div>
    <button class="btn ghost" style="margin-top:14px;" onclick="backToCal()">달력으로 돌아가기</button>
  </div>
</div>

<div class="bar hidden" id="bar">
  <div class="bar-inner">
    <div class="sum" id="sum">선택한 날짜가 없습니다.</div>
    <button class="btn" id="btnSubmit" onclick="doSubmit()" disabled>연차 신청하기</button>
  </div>
</div>

<script src="supabase-init-hr.js"></script>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token');
let MONTH = params.get('m') || '';
if(!/^\d{4}-\d{2}$/.test(MONTH)){ const n = new Date(); MONTH = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
const [Y, M] = MONTH.split('-').map(Number);
const DOW = ['일','월','화','수','목','금','토'];
let ME = { name:'', phone:'' };
let EXIST = {};          // 'YYYY-MM-DD' -> [{kind,status}]
let SEL = {};            // 'YYYY-MM-DD' -> kind (이번에 새로 선택)
let CUR_KIND = '연차';

function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${Y}-${pad(M)}-${pad(d)}`; }
function show(id, on){ $(id).classList.toggle('hidden', !on); }
function weight(k){ return k==='연차' ? 1 : 0.5; }

(function init(){
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!TOKEN || !uuid.test(TOKEN)){ show('badLink', true); return; }
  $('hdrSub').textContent = `${Y}년 ${M}월 연차 신청`;
  show('stepAuth', true);
  $('kinds').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    CUR_KIND = b.dataset.k;
    [...$('kinds').children].forEach(x=>x.classList.toggle('on', x===b));
  });
})();

async function callGet(){
  const { data, error } = await hrsb.rpc('hr_leave_portal_get', { p_token: TOKEN, p_name: ME.name, p_phone: ME.phone, p_month: MONTH });
  if(error) throw error;
  return data;
}

async function doAuth(){
  const name = $('inName').value.trim(), phone = $('inPhone').value.trim();
  $('authErr').textContent = '';
  if(!name || phone.replace(/\D/g,'').length < 9){ $('authErr').textContent = '이름과 연락처를 정확히 입력해 주세요.'; return; }
  ME = { name, phone };
  $('btnAuth').disabled = true; $('btnAuth').textContent = '확인 중...';
  try{
    const r = await callGet();
    if(!r || !r.ok){ $('authErr').textContent = (r && r.error) || '확인에 실패했습니다.'; return; }
    ME.name = r.name;
    loadExisting(r.items);
    show('stepAuth', false); show('stepCal', true); show('bar', true);
    $('helloName').textContent = `${r.name}님, 안녕하세요`;
    $('monthLabel').textContent = `${Y}년 ${M}월`;
    renderCal();
  }catch(e){
    console.error(e);
    $('authErr').textContent = '서버 연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요. (관리자가 연차 신청용 SQL을 아직 실행하지 않았을 수도 있습니다)';
  }finally{
    $('btnAuth').disabled = false; $('btnAuth').textContent = '확인하고 달력 보기';
  }
}

function loadExisting(items){
  EXIST = {};
  (items||[]).forEach(it=>{ (EXIST[it.date] = EXIST[it.date] || []).push(it); });
}

function renderCal(){
  const first = new Date(Y, M-1, 1).getDay();
  const last = new Date(Y, M, 0).getDate();
  let h = DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) h += '<div class="day empty"></div>';
  for(let d=1; d<=last; d++){
    const key = ymd(d), dow = new Date(Y, M-1, d).getDay();
    const ex = EXIST[key] || [];
    let cls = 'day' + (dow===0?' sun':dow===6?' sat':''), tags = '';
    ex.forEach(x=>{
      const st = x.status==='approved' ? 'ok' : x.status==='pending' ? 'pend' : 'rej';
      if(!cls.includes(' '+st)) cls += ' '+st;
      const label = x.status==='approved' ? x.kind : x.status==='pending' ? x.kind+'·대기' : x.kind+'·반려';
      tags += `<div class="tag">${label}</div>`;
    });
    if(SEL[key]){ cls += ' sel'; tags += `<div class="tag">${SEL[key]}</div>`; }
    h += `<div class="${cls}" data-d="${d}">${d}${tags}</div>`;
  }
  $('cal').innerHTML = h;
  $('cal').querySelectorAll('.day[data-d]').forEach(el=>el.addEventListener('click', ()=>toggleDay(Number(el.dataset.d))));
  updateSum();
}

function dayLoad(key){
  return (EXIST[key]||[]).filter(x=>x.status!=='rejected').reduce((s,x)=>s+weight(x.kind),0);
}
function toggleDay(d){
  const key = ymd(d);
  if(SEL[key]){ delete SEL[key]; renderCal(); return; }
  if(dayLoad(key) + weight(CUR_KIND) > 1){ alert('이 날짜에는 이미 연차(또는 대기 중인 신청)가 있어 더 신청할 수 없습니다.'); return; }
  SEL[key] = CUR_KIND; renderCal();
}

function updateSum(){
  const keys = Object.keys(SEL).sort();
  const days = keys.reduce((s,k)=>s+weight(SEL[k]),0);
  $('sum').textContent = keys.length ? `${keys.length}건 선택 · 총 ${days}일` : '선택한 날짜가 없습니다.';
  $('btnSubmit').disabled = keys.length===0;
}

async function doSubmit(){
  const keys = Object.keys(SEL).sort();
  if(!keys.length) return;
  const lines = keys.map(k=>`${Number(k.slice(5,7))}월 ${Number(k.slice(8))}일(${DOW[new Date(k).getDay()]}) ${SEL[k]}`).join('\n');
  if(!confirm(`아래 내용으로 연차를 신청할까요?\n\n${lines}`)) return;
  $('btnSubmit').disabled = true; $('btnSubmit').textContent = '신청 중...';
  try{
    const items = keys.map(k=>({ date:k, kind:SEL[k] }));
    const { data, error } = await hrsb.rpc('hr_leave_portal_submit', { p_token: TOKEN, p_name: ME.name, p_phone: ME.phone, p_items: items });
    if(error) throw error;
    if(!data || !data.ok){ alert((data && data.error) || '신청에 실패했습니다.'); return; }
    SEL = {};
    const r = await callGet(); if(r && r.ok) loadExisting(r.items);
    show('stepCal', false); show('bar', false); show('stepDone', true);
    $('doneTitle').textContent = `${data.added}건 신청되었습니다`;
    const sk = (data.skipped||[]);
    $('doneNote').innerHTML = '관리자 승인 후 연차에 반영됩니다.' + (sk.length ? `<br><br>이미 신청되어 있거나 신청할 수 없어 제외된 날짜:<br>${sk.join(', ')}` : '');
  }catch(e){
    console.error(e); alert('신청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
  }finally{
    $('btnSubmit').textContent = '연차 신청하기'; updateSum();
  }
}
function backToCal(){ show('stepDone', false); show('stepCal', true); show('bar', true); renderCal(); }
</script>
</body>
</html>
